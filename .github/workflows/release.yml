name: Build and publish Shahab Scanner

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shahab-Scanner-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r windows/requirements.txt pyinstaller
      - name: Build EXE and package
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "Shahab Scanner" windows/main.py
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/Shahab Scanner/Shahab Scanner.exe" "release/Shahab-Scanner-Windows.exe"
          Compress-Archive -Path "dist/Shahab Scanner/*" -DestinationPath "release/Shahab-Scanner-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Shahab-Scanner-Windows
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "Shahab Scanner ${GITHUB_REF_NAME}" --notes-file README.md
